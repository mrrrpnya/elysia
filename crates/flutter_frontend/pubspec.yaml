name: elysia
description: "Elysia Game Launcher - Flutter frontend with Rust backend"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # Flutter Rust Bridge for Rust integration
  flutter_rust_bridge: ^2.11.1
  
  # State management
  provider: ^6.1.2
  
  # Image handling with caching
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  
  # File paths
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # UI components
  carousel_slider: ^5.0.0
  
  # URL launching
  url_launcher: ^6.3.1
  
  # Persistent storage for app preferences
  shared_preferences: ^2.3.3
  
  # Icons
  cupertino_icons: ^1.0.8
  
  # Archive extraction for components
  archive: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Required for flutter_rust_bridge codegen
  ffigen: ^14.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

