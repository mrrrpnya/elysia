name: Build Elysia Linux x64

on:
  push:
    branches: [ dev ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            libasound2-dev \
            libmpv-dev
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen || true
      
      - name: Build Rust backend (release)
        run: |
          cargo build --release -p rust_bridge
          echo "Rust backend built successfully"
          ls -la target/release/librust_bridge.so || echo "Library not found"
      
      - name: Get Flutter dependencies
        working-directory: crates/flutter_frontend
        run: flutter pub get
      
      - name: Generate flutter_rust_bridge bindings
        working-directory: crates/flutter_frontend
        run: |
          echo "Generating FFI bindings..."
          flutter_rust_bridge_codegen generate 2>&1 || {
            echo "Warning: Codegen had issues, checking if build can continue..."
          }
          # List generated files
          echo "Generated files in lib/src/rust/:"
          ls -la lib/src/rust/ || echo "No files generated"
      
      - name: Analyze Flutter code
        working-directory: crates/flutter_frontend
        run: flutter analyze || echo "Analysis completed with warnings"
      
      - name: Run Flutter tests
        working-directory: crates/flutter_frontend
        run: flutter test || echo "Tests completed"
      
      - name: Prepare Rust library for Flutter build
        run: |
          mkdir -p crates/flutter_frontend/linux/libs
          if [ -f "target/release/librust_bridge.so" ]; then
            cp target/release/librust_bridge.so crates/flutter_frontend/linux/libs/
            echo "Rust library copied to Flutter linux/libs/"
          else
            echo "Warning: Rust library not found"
          fi
      
      - name: Build Flutter Linux release
        working-directory: crates/flutter_frontend
        run: |
          flutter clean
          flutter build linux --release
          echo "Flutter build completed"
      
      - name: Bundle Rust libraries with Flutter app
        run: |
          BUNDLE_DIR="crates/flutter_frontend/build/linux/x64/release/bundle/lib"
          mkdir -p "$BUNDLE_DIR"
          
          if [ -f "target/release/librust_bridge.so" ]; then
            cp target/release/librust_bridge.so "$BUNDLE_DIR/"
            echo "Rust library bundled with app"
          fi
          
          # Bundle libmpv.so.1 from media_kit_libs_linux package
          echo "Searching for libmpv.so.1 from media_kit_libs_linux..."
          
          # Find libmpv.so.1 in Flutter pub cache (media_kit_libs_linux stores it there)
          MEDIA_KIT_MPV=$(find ~/.pub-cache -name "libmpv.so.1" -path "*/media_kit_libs_linux/*" 2>/dev/null | head -1)
          if [ -n "$MEDIA_KIT_MPV" ] && [ -f "$MEDIA_KIT_MPV" ]; then
            cp "$MEDIA_KIT_MPV" "$BUNDLE_DIR/"
            echo "libmpv.so.1 bundled from media_kit_libs_linux: $MEDIA_KIT_MPV"
          else
            # Also check in the build directory
            BUILD_MPV=$(find crates/flutter_frontend/build -name "libmpv.so.1" 2>/dev/null | head -1)
            if [ -n "$BUILD_MPV" ] && [ -f "$BUILD_MPV" ]; then
              cp "$BUILD_MPV" "$BUNDLE_DIR/"
              echo "libmpv.so.1 bundled from build: $BUILD_MPV"
            else
              echo "WARNING: libmpv.so.1 not found in media_kit_libs_linux or build directory"
              echo "Searching entire pub-cache..."
              find ~/.pub-cache -name "libmpv*" 2>/dev/null || echo "No libmpv files found"
              echo "Searching build directory..."
              find crates/flutter_frontend/build -name "libmpv*" 2>/dev/null || echo "No libmpv files found in build"
            fi
          fi
          
          echo "Bundled libraries:"
          ls -la "$BUNDLE_DIR"
      
      - name: Create release archive
        run: |
          cd crates/flutter_frontend/build/linux/x64/release/bundle
          tar -czvf ../../../../../elysia-linux-x64.tar.gz .
          echo "Archive created: elysia-linux-x64.tar.gz"
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: elysia-linux-x64
          path: crates/flutter_frontend/elysia-linux-x64.tar.gz
          retention-days: 7
