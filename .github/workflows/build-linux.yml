name: Build Elysia Linux x64

on:
  push:
    branches: [ dev ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            libasound2-dev \
            libmpv-dev \
            libmpv2
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen || true
      
      - name: Build Rust backend (release)
        run: |
          cargo build --release -p rust_bridge
          echo "Rust backend built successfully"
          ls -la target/release/librust_bridge.so || echo "Library not found"
      
      - name: Get Flutter dependencies
        working-directory: crates/flutter_frontend
        run: flutter pub get
      
      - name: Generate flutter_rust_bridge bindings
        working-directory: crates/flutter_frontend
        run: |
          echo "Generating FFI bindings..."
          flutter_rust_bridge_codegen generate 2>&1 || {
            echo "Warning: Codegen had issues, checking if build can continue..."
          }
          # List generated files
          echo "Generated files in lib/src/rust/:"
          ls -la lib/src/rust/ || echo "No files generated"
      
      - name: Analyze Flutter code
        working-directory: crates/flutter_frontend
        run: flutter analyze || echo "Analysis completed with warnings"
      
      - name: Run Flutter tests
        working-directory: crates/flutter_frontend
        run: flutter test || echo "Tests completed"
      
      - name: Prepare Rust library for Flutter build
        run: |
          mkdir -p crates/flutter_frontend/linux/libs
          if [ -f "target/release/librust_bridge.so" ]; then
            cp target/release/librust_bridge.so crates/flutter_frontend/linux/libs/
            echo "Rust library copied to Flutter linux/libs/"
          else
            echo "Warning: Rust library not found"
          fi
      
      - name: Build Flutter Linux release
        working-directory: crates/flutter_frontend
        run: |
          flutter clean
          flutter build linux --release
          echo "Flutter build completed"
      
      - name: Bundle Rust libraries with Flutter app
        run: |
          BUNDLE_DIR="crates/flutter_frontend/build/linux/x64/release/bundle/lib"
          mkdir -p "$BUNDLE_DIR"
          
          if [ -f "target/release/librust_bridge.so" ]; then
            cp target/release/librust_bridge.so "$BUNDLE_DIR/"
            echo "Rust library bundled with app"
          fi
          
          # Bundle libmpv for video playback
          # media_kit_libs_linux expects libmpv.so.1 but Ubuntu 22.04 has libmpv.so.2
          echo "Bundling libmpv..."
          
          # First try to find libmpv.so.1 (from media_kit_libs_linux or older systems)
          MPV_LIB1=$(ldconfig -p | grep 'libmpv.so.1' | head -1 | awk '{print $NF}')
          if [ -n "$MPV_LIB1" ] && [ -f "$MPV_LIB1" ]; then
            cp "$MPV_LIB1" "$BUNDLE_DIR/"
            echo "libmpv.so.1 bundled from $MPV_LIB1"
          fi
          
          # Also bundle libmpv.so.2 if available (Ubuntu 22.04+)
          MPV_LIB2=$(ldconfig -p | grep 'libmpv.so.2' | head -1 | awk '{print $NF}')
          if [ -n "$MPV_LIB2" ] && [ -f "$MPV_LIB2" ]; then
            cp "$MPV_LIB2" "$BUNDLE_DIR/"
            echo "libmpv.so.2 bundled from $MPV_LIB2"
            # Create symlink for compatibility if libmpv.so.1 wasn't found
            if [ ! -f "$BUNDLE_DIR/libmpv.so.1" ]; then
              ln -sf libmpv.so.2 "$BUNDLE_DIR/libmpv.so.1"
              echo "Created libmpv.so.1 symlink to libmpv.so.2"
            fi
          fi
          
          # Fallback: try common paths
          if [ ! -f "$BUNDLE_DIR/libmpv.so.1" ] && [ ! -f "$BUNDLE_DIR/libmpv.so.2" ]; then
            for path in /usr/lib/x86_64-linux-gnu/libmpv.so.2 /usr/lib/x86_64-linux-gnu/libmpv.so.1 /usr/lib/libmpv.so.2 /usr/lib/libmpv.so.1; do
              if [ -f "$path" ]; then
                cp "$path" "$BUNDLE_DIR/"
                echo "libmpv bundled from $path"
                # Create symlink if needed
                if [[ "$path" == *".so.2" ]] && [ ! -f "$BUNDLE_DIR/libmpv.so.1" ]; then
                  ln -sf "$(basename $path)" "$BUNDLE_DIR/libmpv.so.1"
                  echo "Created libmpv.so.1 symlink"
                fi
                break
              fi
            done
          fi
          
          echo "Bundled libraries:"
          ls -la "$BUNDLE_DIR"
      
      - name: Create release archive
        run: |
          cd crates/flutter_frontend/build/linux/x64/release/bundle
          tar -czvf ../../../../../elysia-linux-x64.tar.gz .
          echo "Archive created: elysia-linux-x64.tar.gz"
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: elysia-linux-x64
          path: crates/flutter_frontend/elysia-linux-x64.tar.gz
          retention-days: 7
