name: Build Elysia Linux x64

on:
  push:
    branches: [ dev ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            libasound2-dev \
            file \
            wget \
            libfuse2 \
            ffmpeg \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            fuse \
            sudo \
            jq \
            curl \
            xz-utils \
            zstd
          git config --global --add safe.directory '*'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: 'rustfmt'
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen || true

      - name: Get Flutter dependencies
        working-directory: crates/flutter_frontend
        run: flutter pub get
      
      - name: Generate flutter_rust_bridge bindings
        working-directory: crates/flutter_frontend
        run: |
          echo "Generating FFI bindings..."
          flutter_rust_bridge_codegen generate 2>&1 || {
            echo "Warning: Codegen had issues, checking if build can continue..."
          }
          # List generated files
          echo "Generated files in lib/src/rust/:"
          ls -la lib/src/rust/ || echo "No files generated"
      
      - name: Build Rust backend (release)
        run: |
          cargo build --release -p backend
          echo "Rust backend built successfully"
          ls -la target/release/libbackend.so || echo "Library not found"
      
      - name: Analyze Flutter code
        working-directory: crates/flutter_frontend
        run: flutter analyze || echo "Analysis completed with warnings"
      
      - name: Run Flutter tests
        working-directory: crates/flutter_frontend
        run: flutter test || echo "Tests completed"
      
      - name: Prepare Rust library for Flutter build
        run: |
          mkdir -p crates/flutter_frontend/linux/libs
          if [ -f "target/release/libbackend.so" ]; then
            cp target/release/libbackend.so crates/flutter_frontend/linux/libs/
            echo "Rust library copied to Flutter linux/libs/"
          else
            echo "Warning: Rust library not found"
          fi
      
      - name: Build Flutter Linux release
        working-directory: crates/flutter_frontend
        run: |
          flutter clean
          flutter build linux --release --dart-define=DART_VM_OPTIONS=--old_gen_heap_size=80
          echo "Flutter build completed"
      
      - name: Bundle Rust libraries with Flutter app
        run: |
          BUNDLE_DIR="crates/flutter_frontend/build/linux/x64/release/bundle/lib"
          mkdir -p "$BUNDLE_DIR"
          
          if [ -f "target/release/libbackend.so" ]; then
            cp target/release/libbackend.so "$BUNDLE_DIR/"
            echo "Rust library bundled with app"
          fi
          
          echo "Bundled libraries:"
          ls -la "$BUNDLE_DIR"
      
      - name: Create AppImage with appimage-builder
        run: |
          cd crates/flutter_frontend/build/linux/x64/release/bundle
          
          # Download appimage-builder
          wget -q https://github.com/Lord-Kamina/appimage-builder/releases/download/continuous/appimage-builder_x86_64-AppImage.tar
          tar -xvf appimage-builder_x86_64-AppImage.tar --transform='s/.*\///'
          mv appimage-builder-*-x86_64.AppImage appimage-builder-x86_64.AppImage
          chmod +x appimage-builder-x86_64.AppImage
          
          # Create AppDir structure
          mkdir -p AppDir
          
          # Copy application files
          cp -r data elysia lib AppDir/

          # Create desktop file in root of AppDir (required by appimagetool)
          cat > AppDir/com.elysia.launcher.desktop << EOF
          [Desktop Entry]
          Name=Elysia
          Exec=elysia
          Icon=elysia
          Type=Application
          Categories=Game;
          EOF
          
          # Create appimage-builder recipe
          cat > AppImageBuilder.yml << 'EOF'
          version: 1
          
          AppDir:
            path: ./AppDir
            
            app_info:
              id: com.elysia.launcher
              name: Elysia
              icon: elysia
              version: latest
              exec: elysia
              exec_args: $@
            
            apt:
              arch: amd64
              allow_unauthenticated: true
              sources:
                - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy main universe'
                - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ jammy-updates main universe'
              
              include:
                - ffmpeg
                - librsvg2-common
              
              exclude:
                - libglib2.0-0*
                - libgtk-3-0*
                - libgtk-4-*
                - libatk1.0-0*
                - libatk-bridge2.0-0*
                - libpango*
                - libcairo*
                - libharfbuzz0b
                - libfontconfig1
          
            files:
              exclude:
                - usr/share/man
                - usr/share/doc
                - usr/share/locale

            runtime:
                env:
                  LD_LIBRARY_PATH: '${APPDIR}/usr/lib:${APPDIR}/usr/lib/x86_64-linux-gnu:${APPDIR}/lib:${LD_LIBRARY_PATH}'
                  GIO_MODULE_DIR: '${APPDIR}/usr/lib/gio/modules'
                version: "continuous"
          
          AppImage:
            update-information: None
            sign-key: None
            arch: x86_64
            comp: zstd
          EOF
          
          # Copy icon
          cp ../../../../../elysia.png AppDir/elysia.png
          mkdir -p AppDir/usr/share/icons
          cp ../../../../../elysia.png AppDir/usr/share/icons/elysia.png
          
          # Run appimage-builder
          ./appimage-builder-x86_64.AppImage --recipe AppImageBuilder.yml --skip-test
          
          # Move the generated AppImage
          rm appimage-builder-x86_64.AppImage
          mv *.AppImage ../../../../../elysia-x86_64.AppImage
          
          echo "AppImage created successfully"
          ls -lh ../../../../../elysia-x86_64.AppImage
      
      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: elysia-linux-x64-appimage
          path: crates/flutter_frontend/elysia-x86_64.AppImage
          retention-days: 7
