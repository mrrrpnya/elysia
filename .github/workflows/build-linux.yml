name: Build Elysia Linux x64

on:
  push:
    branches: [ dev ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [ dev ]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-linux.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libssl-dev \
            llvm-dev \
            libclang-dev \
            libasound2-dev \
            file \
            wget \
            fuse \
            libfuse2 \
            libmpv-dev \
            libmpv1
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: 'stable'
          cache: true
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install flutter_rust_bridge_codegen
        run: |
          cargo install flutter_rust_bridge_codegen || true
      
      - name: Build Rust backend (release)
        run: |
          cargo build --release -p rust_bridge
          echo "Rust backend built successfully"
          ls -la target/release/librust_bridge.so || echo "Library not found"
      
      - name: Get Flutter dependencies
        working-directory: crates/flutter_frontend
        run: flutter pub get
      
      - name: Generate flutter_rust_bridge bindings
        working-directory: crates/flutter_frontend
        run: |
          echo "Generating FFI bindings..."
          flutter_rust_bridge_codegen generate 2>&1 || {
            echo "Warning: Codegen had issues, checking if build can continue..."
          }
          # List generated files
          echo "Generated files in lib/src/rust/:"
          ls -la lib/src/rust/ || echo "No files generated"
      
      - name: Analyze Flutter code
        working-directory: crates/flutter_frontend
        run: flutter analyze || echo "Analysis completed with warnings"
      
      - name: Run Flutter tests
        working-directory: crates/flutter_frontend
        run: flutter test || echo "Tests completed"
      
      - name: Prepare Rust library for Flutter build
        run: |
          mkdir -p crates/flutter_frontend/linux/libs
          if [ -f "target/release/librust_bridge.so" ]; then
            cp target/release/librust_bridge.so crates/flutter_frontend/linux/libs/
            echo "Rust library copied to Flutter linux/libs/"
          else
            echo "Warning: Rust library not found"
          fi
      
      - name: Build Flutter Linux release
        working-directory: crates/flutter_frontend
        run: |
          flutter clean
          flutter build linux --release
          echo "Flutter build completed"
      
      - name: Bundle libraries with Flutter app
        run: |
          BUNDLE_DIR="crates/flutter_frontend/build/linux/x64/release/bundle/lib"
          mkdir -p "$BUNDLE_DIR"
          
          # Copy Rust library
          if [ -f "target/release/librust_bridge.so" ]; then
            cp target/release/librust_bridge.so "$BUNDLE_DIR/"
            echo "Bundled: librust_bridge.so"
          fi
          
          # Find and copy libmpv.so.1
          echo "Finding libmpv.so.1..."
          MPV_LIB=$(ldconfig -p | grep 'libmpv.so.1 ' | awk '{print $4}' | head -n 1)
          if [ -n "$MPV_LIB" ] && [ -f "$MPV_LIB" ]; then
            cp "$MPV_LIB" "$BUNDLE_DIR/"
            echo "Bundled: $MPV_LIB"
          else
            echo "WARNING: libmpv.so.1 not found"
          fi
          
          # Find and copy libc.so.6 (glibc)
          echo "Finding libc.so.6..."
          LIBC_LIB=$(ldconfig -p | grep 'libc.so.6 ' | awk '{print $4}' | head -n 1)
          if [ -n "$LIBC_LIB" ] && [ -f "$LIBC_LIB" ]; then
            cp "$LIBC_LIB" "$BUNDLE_DIR/"
            echo "Bundled: $LIBC_LIB"
            
            # Also copy the ld-linux loader that libc depends on
            LD_LOADER=$(ldd "$LIBC_LIB" | grep 'ld-linux' | awk '{print $1}')
            if [ -n "$LD_LOADER" ] && [ -f "$LD_LOADER" ]; then
              cp "$LD_LOADER" "$BUNDLE_DIR/"
              echo "Bundled: $LD_LOADER"
            fi
          else
            echo "WARNING: libc.so.6 not found"
          fi
          
          # Get dependencies of libmpv and bundle non-system libs
          if [ -n "$MPV_LIB" ] && [ -f "$MPV_LIB" ]; then
            echo "Finding libmpv dependencies..."
            ldd "$MPV_LIB" | grep "=> /" | awk '{print $3}' | while read dep; do
              # Only bundle libraries from /usr/lib or /usr/local/lib
              if [[ "$dep" == /usr/lib/* ]] || [[ "$dep" == /usr/local/lib/* ]]; then
                if [ -f "$dep" ]; then
                  cp "$dep" "$BUNDLE_DIR/" 2>/dev/null || true
                  echo "Bundled dependency: $(basename $dep)"
                fi
              fi
            done
          fi
          
          echo ""
          echo "All bundled libraries:"
          ls -lh "$BUNDLE_DIR"
      
      - name: Create AppImage
        run: |
          cd crates/flutter_frontend/build/linux/x64/release/bundle
          
          # Download linuxdeploy and appimagetool
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
          
          # Create AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          
          # Copy application files
          cp -r data AppDir/usr/bin/
          cp -r lib AppDir/usr/lib/
          cp elysia AppDir/usr/bin/
          
          # Create desktop file in root of AppDir (required by appimagetool)
          cat > AppDir/elysia.desktop << EOF
          [Desktop Entry]
          Name=Elysia
          Exec=elysia
          Icon=elysia
          Type=Application
          Categories=Game;
          EOF
          
          # Also copy to standard location
          cp AppDir/elysia.desktop AppDir/usr/share/applications/elysia.desktop
          
          # Create a simple icon (placeholder - you should add a real icon)
          convert -size 256x256 xc:blue AppDir/usr/share/icons/hicolor/256x256/apps/elysia.png 2>/dev/null || \
            echo "Icon generation skipped (imagemagick not available)"
          
          # Use linuxdeploy to deploy dependencies automatically
          # The --deploy-deps-only flag automatically finds and bundles all shared library dependencies
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --deploy-deps-only=AppDir/usr/bin/elysia
          
          # Create AppRun script
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/elysia" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # Build AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir ../../../../../elysia-x86_64.AppImage
          
          echo "AppImage created successfully"
          ls -lh ../../../../../elysia-x86_64.AppImage
      
      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: elysia-linux-x64-appimage
          path: crates/flutter_frontend/elysia-x86_64.AppImage
          retention-days: 7
